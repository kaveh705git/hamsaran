<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دلخوری‌های همسران</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: #fff;
    width: 100%;
    max-width: 550px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: #fff;
    padding: 25px;
    text-align: center;
  }

  .header h1 {
    font-size: 22px;
    margin-bottom: 8px;
  }

  .header p {
    font-size: 13px;
    opacity: 0.9;
  }

  /* تب‌ها */
  .tabs {
    display: flex;
    background: #fafafa;
    border-bottom: 2px solid #eee;
  }

  .tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    color: #999;
    transition: 0.3s;
    border-bottom: 3px solid transparent;
  }

  .tab.active {
    color: #c44569;
    border-bottom-color: #ff6b9d;
    background: #fff;
  }

  .tab-content {
    display: none;
    padding: 25px;
  }

  .tab-content.active {
    display: block;
  }

  .form-group {
    margin-bottom: 18px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: #444;
    font-size: 14px;
    font-weight: bold;
  }

  input[type="text"],
  input[type="tel"],
  textarea,
  select {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #eee;
    border-radius: 10px;
    font-size: 14px;
    transition: 0.3s;
    outline: none;
    background: #fafafa;
  }

  input[type="text"]:focus,
  input[type="tel"]:focus,
  textarea:focus,
  select:focus {
    border-color: #ff6b9d;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(255,107,157,0.1);
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  .mood-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .mood-buttons input[type="radio"] {
    display: none;
  }

  .mood-buttons label {
    flex: 1;
    min-width: 70px;
    text-align: center;
    padding: 10px 5px;
    background: #f5f5f5;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: normal;
    transition: 0.3s;
    border: 2px solid transparent;
    margin: 0;
  }

  .mood-buttons input[type="radio"]:checked + label {
    background: #ffe0ec;
    border-color: #ff6b9d;
    color: #c44569;
  }

  .btn-send {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
  }

  .btn-send:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(255,107,157,0.3);
  }

  .btn-send:active {
    transform: translateY(0);
  }

  .btn-secondary {
    width: 100%;
    padding: 10px;
    background: transparent;
    color: #999;
    border: none;
    font-size: 13px;
    cursor: pointer;
    margin-top: 8px;
  }

  .btn-secondary:hover {
    color: #c44569;
  }

  /* استایل مخاطبین ذخیره شده */
  .saved-contacts {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
  }

  .contact-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 15px;
    background: #fafafa;
    border: 2px solid #eee;
    border-radius: 12px;
    transition: 0.3s;
  }

  .contact-card:hover {
    border-color: #ff6b9d;
    background: #fff5f8;
  }

  .contact-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .contact-name {
    font-weight: bold;
    color: #444;
    font-size: 14px;
  }

  .contact-phone {
    font-size: 12px;
    color: #999;
    direction: ltr;
    text-align: right;
  }

  .contact-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 16px;
    padding: 5px 8px;
    border-radius: 6px;
    transition: 0.2s;
  }

  .icon-btn:hover {
    background: #ffe0ec;
  }

  .icon-btn.delete:hover {
    background: #ffdddd;
  }

  .empty-state {
    text-align: center;
    padding: 30px 20px;
    color: #bbb;
    font-size: 14px;
  }

  .empty-state .emoji {
    font-size: 40px;
    display: block;
    margin-bottom: 10px;
  }

  .info-box {
    background: #fff8e6;
    border: 2px solid #ffd76e;
    padding: 12px 15px;
    border-radius: 10px;
    font-size: 12px;
    color: #8a6d00;
    line-height: 1.7;
    margin-bottom: 18px;
  }

  .info-box strong {
    display: block;
    margin-bottom: 5px;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    right: 50%;
    transform: translateX(50%) translateY(100px);
    background: #333;
    color: #fff;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    transition: 0.4s;
    opacity: 0;
    z-index: 999;
    max-width: 90%;
    text-align: center;
  }

  .toast.show {
    transform: translateX(50%) translateY(0);
    opacity: 1;
  }

  .toast.success {
    background: #2ecc71;
  }

  .toast.error {
    background: #e74c3c;
  }

  .footer-note {
    text-align: center;
    padding: 15px;
    font-size: 12px;
    color: #aaa;
    background: #fafafa;
    border-top: 1px solid #eee;
  }

  /* انتخاب سریع مخاطب */
  .quick-select {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .quick-btn {
    padding: 8px 14px;
    background: #f5f5f5;
    border: 2px solid #eee;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.3s;
    color: #555;
  }

  .quick-btn:hover {
    background: #ffe0ec;
    border-color: #ff6b9d;
    color: #c44569;
  }

  .phone-input-wrapper {
    position: relative;
  }

  .phone-input-wrapper input {
    direction: ltr;
    text-align: right;
    padding-left: 40px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>💌 دلخوری‌های همسران</h1>
    <p>بگو چی ناراحتت کرده تا رابطه‌تون بهتر بشه</p>
  </div>

  <!-- تب‌ها -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('send')">📤 ارسال دلخوری</div>
    <div class="tab" onclick="switchTab('contacts')">👥 مخاطبین</div>
  </div>

  <!-- تب ارسال -->
  <div class="tab-content active" id="tab-send">
    <form id="delkhoriForm">
      <div class="form-group">
        <label for="name">اسم شما</label>
        <input type="text" id="name" placeholder="مثلاً: علی" required>
      </div>

      <div class="form-group">
        <label for="spouse">اسم همسر شما</label>
        <input type="text" id="spouse" placeholder="مثلاً: مریم" required>
        <div class="quick-select" id="spouseQuickSelect"></div>
      </div>

      <div class="form-group">
        <label for="phone">شماره واتساپ همسر</label>
        <div class="phone-input-wrapper">
          <input type="tel" id="phone" placeholder="989121234567" dir="ltr">
        </div>
        <div class="quick-select" id="phoneQuickSelect"></div>
      </div>

      <div class="form-group">
        <label>میزان دلخوری</label>
        <div class="mood-buttons">
          <input type="radio" name="mood" id="mood1" value="کم" checked>
          <label for="mood1">🙂 کم</label>

          <input type="radio" name="mood" id="mood2" value="متوسط">
          <label for="mood2">😐 متوسط</label>

          <input type="radio" name="mood" id="mood3" value="زیاد">
          <label for="mood3">😢 زیاد</label>

          <input type="radio" name="mood" id="mood4" value="خیلی زیاد">
          <label for="mood4">😭 خیلی زیاد</label>
        </div>
      </div>

      <div class="form-group">
        <label for="message">متن دلخوری</label>
        <textarea id="message" placeholder="بنویس چه چیزی ناراحتت کرده..." required></textarea>
      </div>

      <div class="form-group">
        <label for="app">ارسال از طریق</label>
        <select id="app" required>
          <option value="">-- انتخاب پیام‌رسان --</option>
         <option value="ble">بله</option>
         <option value="rubika">روبیکا</option>
          <option value="whatsapp">واتساپ (WhatsApp)</option>
          <option value="telegram">تلگرام (Telegram)</option>
          <option value="sms">پیامک (SMS)</option>
          <option value="email">ایمیل</option>
        </select>
      </div>

      <div class="form-group">
        <label style="font-weight: normal; display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="saveContact" style="width: auto; margin: 0;">
          <span>ذخیره این شماره در لیست مخاطبین</span>
        </label>
      </div>

      <button type="submit" class="btn-send">📤 ارسال دلخوری</button>
      <button type="button" class="btn-secondary" onclick="resetForm()">پاک کردن فرم</button>
    </form>
  </div>

  <!-- تب مخاطبین -->
  <div class="tab-content" id="tab-contacts">
    <div class="info-box">
      <strong>💡 راهنما:</strong>
      شماره‌ها به صورت کامل با کد کشور وارد شوند (مثلاً ایران: <code style="direction:ltr; display:inline-block;">989121234567</code> بدون + و بدون صفر اول)
    </div>

    <div id="contactsList" class="saved-contacts"></div>
    <div id="emptyState" class="empty-state">
      <span class="emoji">📭</span>
      هنوز هیچ مخاطبی ذخیره نکرده‌اید
    </div>
  </div>

  <div class="footer-note">
    ساخته شده با ❤️ برای همسران | kaveh vpn 
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // =============== مدیریت مخاطبین با localStorage ===============
  const STORAGE_KEY = 'delkhori_contacts';

  function getContacts() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveContacts(contacts) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
  }

  function addContact(name, phone) {
    const contacts = getContacts();
    // جلوگیری از تکراری
    const exists = contacts.find(c => c.phone === phone);
    if (exists) {
      showToast('این شماره قبلاً ذخیره شده ⚠️', 'error');
      return false;
    }
    contacts.push({ name, phone, id: Date.now() });
    saveContacts(contacts);
    renderContacts();
    renderQuickSelect();
    showToast('مخاطب ذخیره شد ✅', 'success');
    return true;
  }

  function deleteContact(id) {
    let contacts = getContacts();
    contacts = contacts.filter(c => c.id !== id);
    saveContacts(contacts);
    renderContacts();
    renderQuickSelect();
    showToast('مخاطب حذف شد 🗑️', 'success');
  }

  function renderContacts() {
    const contacts = getContacts();
    const list = document.getElementById('contactsList');
    const empty = document.getElementById('emptyState');

    if (contacts.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }

    empty.style.display = 'none';
    list.innerHTML = contacts.map(c => `
      <div class="contact-card">
        <div class="contact-info">
          <span class="contact-name">${escapeHtml(c.name)}</span>
          <span class="contact-phone">${escapeHtml(c.phone)}</span>
        </div>
        <div class="contact-actions">
          <button class="icon-btn" title="انتخاب" onclick="selectContact('${escapeHtml(c.name)}', '${escapeHtml(c.phone)}')">✅</button>
          <button class="icon-btn delete" title="حذف" onclick="deleteContact(${c.id})">🗑️</button>
        </div>
      </div>
    `).join('');
  }

  function renderQuickSelect() {
    const contacts = getContacts();
    const spouseQuick = document.getElementById('spouseQuickSelect');
    const phoneQuick = document.getElementById('phoneQuickSelect');

    if (contacts.length === 0) {
      spouseQuick.innerHTML = '';
      phoneQuick.innerHTML = '';
      return;
    }

    spouseQuick.innerHTML = contacts.map(c => 
      `<button type="button" class="quick-btn" onclick="selectContact('${escapeHtml(c.name)}', '${escapeHtml(c.phone)}')">💑 ${escapeHtml(c.name)}</button>`
    ).join('');

    phoneQuick.innerHTML = contacts.map(c => 
      `<button type="button" class="quick-btn" onclick="document.getElementById('phone').value='${escapeHtml(c.phone)}'">📱 ${escapeHtml(c.name)}</button>`
    ).join('');
  }

  function selectContact(name, phone) {
    document.getElementById('spouse').value = name;
    document.getElementById('phone').value = phone;
    switchTab('send');
    showToast(`مخاطب "${name}" انتخاب شد ✅`, 'success');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // =============== مدیریت تب‌ها ===============
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

    if (tab === 'send') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('tab-send').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('tab-contacts').classList.add('active');
    }
  }

  // =============== Toast ===============
  const toast = document.getElementById('toast');
  let toastTimer;

  function showToast(msg, type = '') {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = 'toast show';
    if (type) toast.classList.add(type);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  // =============== فرم ===============
  const form = document.getElementById('delkhoriForm');

  function resetForm() {
    form.reset();
    showToast('فرم پاک شد ✅', 'success');
  }

  // نرمال‌سازی شماره تلفن
  function normalizePhone(phone) {
    if (!phone) return '';
    // حذف کاراکترهای غیرعددی
    let cleaned = phone.replace(/[^\d]/g, '');
    // اگر با 0 شروع شده، حذف شود
    if (cleaned.startsWith('0')) {
      cleaned = cleaned.substring(1);
    }
    // اگر بدون کد کشور است، 98 اضافه شود (برای ایران)
    if (cleaned.length === 10 && cleaned.startsWith('9')) {
      cleaned = '98' + cleaned;
    }
    return cleaned;
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const spouse = document.getElementById('spouse').value.trim();
    const phoneRaw = document.getElementById('phone').value.trim();
    const mood = document.querySelector('input[name="mood"]:checked').value;
    const message = document.getElementById('message').value.trim();
    const app = document.getElementById('app').value;
    const shouldSave = document.getElementById('saveContact').checked;

    if (!name || !spouse || !message || !app) {
      showToast('لطفاً همه فیلدها را پر کن ⚠️', 'error');
      return;
    }

    const phone = normalizePhone(phoneRaw);

    // ذخیره مخاطب اگر درخواست شده
    if (shouldSave && phone) {
      addContact(spouse, phone);
    }

    const fullText = 
      `💌 دلخوری از طرف: ${name}\n` +
      `👤 خطاب به: ${spouse}\n` +
      `📊 میزان دلخوری: ${mood}\n\n` +
      `📝 متن پیام:\n${message}\n\n` +
      `— ارسال شده از سایت دلخوری‌های همسران`;

    const encodedText = encodeURIComponent(fullText);

    let url = '';
    switch (app) {
      case 'whatsapp':
        if (!phone) {
          showToast('برای واتساپ شماره همسر را وارد کن ⚠️', 'error');
          return;
        }
        // ارسال مستقیم به شماره مشخص در واتساپ
        url = `https://wa.me/${phone}?text=${encodedText}`;
        break;

      case 'telegram':
        // تلگرام اجازه ارسال به شماره دلخواه را نمی‌دهد، فقط اشتراک‌گذاری عمومی
        url = `https://t.me/share/url?url=&text=${encodedText}`;
        showToast('در تلگرام مخاطب را خودت انتخاب کن 📲', '');
        break;

      case 'sms':
        if (!phone) {
          showToast('برای پیامک شماره را وارد کن ⚠️', 'error');
          return;
        }
        // در موبایل با sms: و شماره
        url = `sms:+${phone}?body=${encodedText}`;
        break;

      case 'email':
        const subject = encodeURIComponent(`دلخوری از ${name}`);
        url = `mailto:?subject=${subject}&body=${encodedText}`;
        break;

      case 'ble':
        if (!phone) {
          showToast('برای بله شماره همسر را وارد کن ⚠️', 'error');
          return;
        }
        // ارسال مستقیم به شماره مشخص در واتساپ
        url = `https://ble.ir/${phone}?text=${encodedText}`;
        break;

      case 'Rubika':
        if (!phone) {
          showToast('برای روبیکا شماره همسر را وارد کن ⚠️', 'error');
          return;
        }
        // ارسال مستقیم به شماره مشخص در واتساپ
        url = `https://rubika.ir/${phone}?text=${encodedText}`;
        break;
      
      

      default:
        showToast('پیام‌رسان معتبر انتخاب کن ⚠️', 'error');
        return;
    }

    showToast('در حال باز کردن پیام‌رسان... 📩', 'success');

    setTimeout(() => {
      window.open(url, '_blank');
    }, 500);
  });

  // =============== راه‌اندازی اولیه ===============
  renderContacts();
  renderQuickSelect();
</script>

</body>
</html>
